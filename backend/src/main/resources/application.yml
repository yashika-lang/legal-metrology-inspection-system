# ==============================================================================
# Base configuration — shared across all profiles.
# Profile-specific files (application-{dev,local,prod}.yml) override these.
# Activate a profile via SPRING_PROFILES_ACTIVE (env var) or --spring.profiles.active
# ==============================================================================

spring:
  application:
    name: legal-metrology-inspection-system

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # Local dev sets DB_URL directly (see backend/.env.example). Render's
    # managed Postgres is wired via separate DB_HOST/DB_PORT/DB_NAME env
    # vars instead (see render.yaml) — Render's own connection string uses
    # a bare `postgres://` scheme, which the PostgreSQL JDBC driver does
    # not accept (`DriverManager` matches drivers by a `jdbc:` prefix), so
    # the URL is built from parts there rather than passed through as-is.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:legal_metrology}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:15MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:30MB}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true # Java 21 virtual threads — cheap blocking I/O for the many outbound AI/storage calls

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}      # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
    issuer: ${JWT_ISSUER:legal-metrology-inspection-system}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  password-reset:
    token-expiration-ms: ${PASSWORD_RESET_TOKEN_EXPIRATION_MS:3600000}       # 1 hour

  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage:
      bucket-images: ${SUPABASE_BUCKET_IMAGES:images}
      bucket-reports: ${SUPABASE_BUCKET_REPORTS:reports}
      bucket-evidence: ${SUPABASE_BUCKET_EVIDENCE:evidence}
      bucket-temp: ${SUPABASE_BUCKET_TEMP:temp}
      bucket-exports: ${SUPABASE_BUCKET_EXPORTS:exports}
      bucket-training-data: ${SUPABASE_BUCKET_TRAINING_DATA:training-data}
      signed-url-expiry-seconds: ${SUPABASE_SIGNED_URL_EXPIRY_SECONDS:3600}

ai:
  ocr:
    provider: ${AI_OCR_PROVIDER:google-vision}   # google-vision | tesseract
    google-vision:
      api-key: ${GOOGLE_VISION_API_KEY:}
      project-id: ${GOOGLE_CLOUD_PROJECT_ID:}
    tesseract:
      data-path: ${TESSERACT_DATA_PATH:/usr/local/share/tessdata}
      language: ${TESSERACT_LANGUAGE:eng}

  vision:
    provider: ${AI_VISION_PROVIDER:gemini}       # gemini | claude

  llm:
    provider: ${AI_LLM_PROVIDER:gemini}          # gemini | claude

  gemini:
    api-key: ${GEMINI_API_KEY:}
    # Google periodically retires model versions — if this default 404s with
    # "no longer available", check https://ai.google.dev/gemini-api/docs/models
    # for the current lineup. Free-tier keys may also have zero quota on
    # "pro" models even when they exist; "flash" models are the ones with
    # real free-tier quota as of this writing.
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    vision-model: ${GEMINI_VISION_MODEL:gemini-3.6-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    embedding-dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:768}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${CLAUDE_MODEL:claude-opus-4-1}
    base-url: ${CLAUDE_BASE_URL:https://api.anthropic.com/v1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
